<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="160" viewBox="0 0 1200 160" role="img" aria-labelledby="title desc"><title id="title">Declan builder signal ticker</title><desc id="desc">A slim LED-style ticker showing CTA 02 MIN, HR 142 BPM, PACE 6:18 / MI, minus 1240 dollars caught, and NOW PLAYING.</desc><defs><linearGradient id="panelGradient" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0b0f17" /><stop offset="100%" stop-color="#111827" /></linearGradient><filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6" result="blur" /><feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge></filter></defs><rect x="0.5" y="0.5" width="1199" height="159" rx="24" fill="url(#panelGradient)" stroke="rgba(255,255,255,0.12)" /><text x="24" y="18" fill="#667085" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="12" letter-spacing="2">LIVE SIGNALS FROM PROJECTS I COULDN&apos;T LEAVE ALONE</text><g filter="url(#glow)"><g><rect x="18" y="22" width="220" height="116" rx="18" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.10)" /><circle cx="36" cy="42" r="4" fill="#ff8a1a" /><text x="48" y="46" fill="#98a2b3" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="14" letter-spacing="1.4">CHITRACK</text><text x="40" y="100" fill="#ff8a1a" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="28" font-weight="700" letter-spacing="1">CTA 02 MIN</text></g><g><rect x="254" y="22" width="220" height="116" rx="18" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.10)" /><circle cx="272" cy="42" r="4" fill="#ff8a1a" /><text x="284" y="46" fill="#98a2b3" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="14" letter-spacing="1.4">SURGENT</text><text x="276" y="100" fill="#ff8a1a" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="28" font-weight="700" letter-spacing="1">HR 142 BPM</text></g><g><rect x="490" y="22" width="220" height="116" rx="18" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.10)" /><circle cx="508" cy="42" r="4" fill="#ff8a1a" /><text x="520" y="46" fill="#98a2b3" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="14" letter-spacing="1.4">RACE TIME CALCULATOR</text><text x="512" y="100" fill="#ff8a1a" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="28" font-weight="700" letter-spacing="1">PACE 6:18 / MI</text></g><g><rect x="726" y="22" width="220" height="116" rx="18" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.10)" /><circle cx="744" cy="42" r="4" fill="#ff8a1a" /><text x="756" y="46" fill="#98a2b3" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="14" letter-spacing="1.4">CONSTRUCTION PROCUREMENT</text><text x="748" y="100" fill="#ff8a1a" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="28" font-weight="700" letter-spacing="1">-$1,240 CAUGHT</text></g><g><rect x="962" y="22" width="220" height="116" rx="18" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.10)" /><circle cx="980" cy="42" r="4" fill="#ff8a1a" /><text x="992" y="46" fill="#98a2b3" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="14" letter-spacing="1.4">MAGIC RECORD PLAYER</text><g transform="translate(976 38)" fill="#ff8a1a" stroke="#ff8a1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="8" x2="22" y2="56" /><line x1="48" y1="4" x2="48" y2="52" /><line x1="22" y1="8" x2="48" y2="4" /><ellipse cx="20" cy="64" rx="12" ry="9" /><ellipse cx="46"